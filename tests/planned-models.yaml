  speech/moss-tts-nano-100m:
    kind: tts-cloning
    fixtures: [authorized-reference.wav]
    assertions: [valid-wav, first-audio-latency, realtime-factor, long-text-stability, clone-similarity, consent-boundary]
  speech/qwen3-tts-0.6b-base:
    kind: streaming-tts-cloning
    fixtures: [authorized-reference.wav]
    assertions: [valid-stream, first-audio-latency, multilingual-text, clone-similarity, named-voice-enumeration, unload-to-baseline]
  music/ace-step-15-xl-turbo:
    kind: music-generation-editing
