schema: 1
# Promotion tests for canonical candidates. These are specifications, not executable
# until the named runtime/adapter is registered in llama-swap.
planned_tests:
  speech/qwen3-asr-0.6b:
    kind: transcription-multilingual-streaming
    fixtures: [en-short.wav, fr-short.wav, song-vocal-short.wav]
    assertions: [keyword-accuracy, first-partial-latency, realtime-factor, unload-to-baseline]
  speech/moss-transcribe-diarize-0.9b:
    kind: transcription-diarization
    fixtures: [two-speaker-60s.wav, long-form-10m.wav]
