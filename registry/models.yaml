schema: 1
hardware_profile:
  physical_ram_gib: 128
  gpu_mappable_ceiling_gib: 96
  normal_gpu_budget_gib: 90
  protected_host_gib: 20
  host_model_root: "${MODEL_DIR from .env; mounted as /models}"

# enabled=true means the supplied llama-swap config exposes it immediately.
# staged entries require the runtime/adapter described in docs/STAGED-MULTIMEDIA.md.
models:
  - id: llm/fast
    enabled: true
    role: fast-agent
    engine: llama.cpp-vulkan
    source: unsloth/Qwen3.5-35B-A3B-GGUF
    files: [Qwen3.5-35B-A3B-Q5_K_M.gguf]
    local_dir: models/llm/qwen35
    license: Apache-2.0-base-model
    approximate_weight_gib: 26.2
    ttl_seconds: 1800

  - id: llm/reasoning
    enabled: true
    role: strong-reasoning
    engine: llama.cpp-vulkan
    source: unsloth/Qwen3.5-122B-A10B-GGUF
    include: [Q4_K_M/*.gguf]
    local_dir: models/llm/qwen122
    license: Apache-2.0-base-model
    approximate_weight_gib: 76.5
    ttl_seconds: 600

  - id: llm/coder
    enabled: true
    role: coding-agent
    engine: llama.cpp-vulkan
    source: Qwen/Qwen3-Coder-Next-GGUF
    include: [Qwen3-Coder-Next-Q5_K_M/*.gguf]
    local_dir: models/llm/coder
    license: Apache-2.0
    approximate_weight_gib: 56.7
    ttl_seconds: 900

  - id: llm/vision
    enabled: true
    role: vision-language
    engine: llama.cpp-vulkan
    source: Qwen/Qwen3-VL-32B-Instruct-GGUF
    files:
      - Qwen3VL-32B-Instruct-Q4_K_M.gguf
      - mmproj-Qwen3VL-32B-Instruct-Q8_0.gguf
    local_dir: models/vision/qwen3vl
    license: Apache-2.0
    approximate_weight_gib: 22
    ttl_seconds: 900

  - id: retrieval/embedding
    enabled: true
    role: embedding
    engine: llama.cpp-vulkan
    source: Qwen/Qwen3-Embedding-4B-GGUF
    files: [Qwen3-Embedding-4B-Q8_0.gguf]
    local_dir: models/retrieval
    license: Apache-2.0
    approximate_weight_gib: 4.3
    ttl_seconds: 1800

  - id: retrieval/reranker
    enabled: true
    role: reranker
    engine: llama.cpp-vulkan
    source: Voodisss/Qwen3-Reranker-4B-GGUF-llama_cpp
    files: [Qwen3-Reranker-4B-Q4_K_M.gguf]
    local_dir: models/retrieval
    license: Apache-2.0-base-model
    approximate_weight_gib: 2.5
    ttl_seconds: 1800

  - id: speech/whisper-large-v3-turbo
    enabled: true
    role: speech-to-text
    engine: whisper.cpp-vulkan
    source: ggerganov/whisper.cpp
    files: [ggml-large-v3-turbo-q5_0.bin]
    local_dir: models/speech/whisper
    license: MIT
    approximate_weight_gib: 1.0
    ttl_seconds: 1800

  - id: speech/kokoro
    enabled: true
    role: text-to-speech
    engine: audio.cpp-cpu
    source: audio-cpp/audio.cpp-gguf
    files: [Kokoro-82M-GGUF/kokoro-82m-q8_0.gguf]
    local_dir: models/speech/kokoro
    flatten: true
    license: Apache-2.0
    approximate_weight_gib: 0.3
    ttl_seconds: 1800

  # Curated speech/audio registry v2026.11.19.
  # "balanced" favors permissive licensing, native/portable runtimes, and simple APIs.
