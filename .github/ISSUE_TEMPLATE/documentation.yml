name: Documentation improvement
description: Report unclear, incomplete, or incorrect instructions.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Document path or URL
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Description
      description: State what is unclear or incorrect.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed text or structure
  - type: checkboxes
    id: style
    attributes:
      label: Writing checks
      options:
        - label: I used simplified technical English.
          required: true
        - label: I removed credentials and personal data.
          required: true
