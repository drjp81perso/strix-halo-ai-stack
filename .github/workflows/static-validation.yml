name: Static validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install pyyaml
      - name: Create CI environment file
        run: cp .env.example .env
      - name: Check executable scripts
        run: |
          test -x scripts/test-protocol
          test -x scripts/validate
          test -x scripts/ai-stack
      - name: Run static acceptance protocol
        run: bash scripts/test-protocol static
