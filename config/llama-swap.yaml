# Reference model roster; memory thresholds come from .env.
# See docs/CUSTOMIZING.md and docs/REFERENCE-STRIX-HALO.md.
# All heavyweight models are exclusive. TTL is seconds.
healthCheckTimeout: 1200
logLevel: info
logToStdout: "proxy,upstream,http"
logTimeFormat: rfc3339
sendLoadingState: true
includeAliasesInList: true
globalTTL: 900
unloadTimeout: 60
# Open WebUI can issue a chat request plus a background title/tag/task request.
# Permit the normal small request burst; heavyweight residency remains exclusive.
globalConcurrencyLimit: ${env.GLOBAL_CONCURRENCY_LIMIT}
maxRequestBodyMB: 500
store:
  path: /state/llama-swap.sqlite
  persistCaptures: false
apiKeys:
  - "${env.AI_API_KEY}"
security:
  cors:
    allowedOrigins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
    allowCredentials: true

models:
  llm/fast:
    name: "Qwen 3.5 35B-A3B — Fast Agent"
    description: "Default tool-capable MoE assistant; Q5_K_M; 32K context"
    capabilities: { in: [text], out: [text], tools: true, context: 32768 }
    cmd: >-
      admit-run ${env.HEAVY_HOST_RESERVE_GB} ${env.HEAVY_MAX_CURRENT_GTT_GB} --
      llama-server --host 127.0.0.1 --port ${PORT}
      --model /models/llm/qwen35/Qwen3.5-35B-A3B-Q5_K_M.gguf
      --ctx-size 32768 --parallel 1 --n-gpu-layers 999
      --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
      --jinja --reasoning off
    ttl: 1800
    aliases: [agent-fast]

  llm/reasoning:
    name: "Qwen 3.5 122B-A10B — Strong Reasoner"
    description: "Large Q4_K_M MoE; 16K context; automatic GPU/host fitting"
    capabilities: { in: [text], out: [text], tools: true, context: 16384 }
    cmd: >-
      admit-run ${env.HEAVY_HOST_RESERVE_GB} ${env.HEAVY_MAX_CURRENT_GTT_GB} --
      llama-server --host 127.0.0.1 --port ${PORT}
      --model /models/llm/qwen122/Qwen3.5-122B-A10B-Q4_K_M-00001-of-00003.gguf
      --ctx-size 16384 --parallel 1 --n-gpu-layers auto
      --fit on --fit-target ${env.GPU_FIT_TARGET_MIB} --fit-ctx ${env.MIN_FIT_CONTEXT}
      --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
      --jinja
      --reasoning on
      --reasoning-effort low
      --reasoning-budget 768
      --reasoning-budget-message "Reasoning budget reached. Use the values already computed above, verify the numerator once, and provide only the concise final answer."
    ttl: 600
    aliases: [reasoning-strong]

  llm/coder:
    name: "Qwen 3 Coder Next — Coding Agent"
    description: "Q5_K_M coding MoE; 32K context; automatic GPU/host fitting"
    capabilities: { in: [text], out: [text], tools: true, context: 32768 }
    cmd: >-
      admit-run ${env.HEAVY_HOST_RESERVE_GB} ${env.HEAVY_MAX_CURRENT_GTT_GB} --
      llama-server --host 127.0.0.1 --port ${PORT}
      --model /models/llm/coder/Qwen3-Coder-Next-Q5_K_M-00001-of-00004.gguf
      --ctx-size 32768 --parallel 1 --n-gpu-layers auto
      --fit on --fit-target ${env.GPU_FIT_TARGET_MIB} --fit-ctx ${env.MIN_FIT_CONTEXT}
      --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
      --jinja
    ttl: 900
    aliases: [coder]

  llm/vision:
    name: "Qwen 3 VL 32B — Vision"
    description: "Q4_K_M vision-language model with Q8 projector"
    capabilities: { in: [text, image, video], out: [text], tools: true, context: 32768 }
    cmd: >-
      admit-run ${env.HEAVY_HOST_RESERVE_GB} ${env.HEAVY_MAX_CURRENT_GTT_GB} --
      llama-server --host 127.0.0.1 --port ${PORT}
      --model /models/vision/qwen3vl/Qwen3VL-32B-Instruct-Q4_K_M.gguf
      --mmproj /models/vision/qwen3vl/mmproj-Qwen3VL-32B-Instruct-Q8_0.gguf
      --ctx-size 32768 --parallel 1 --n-gpu-layers 999
      --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
      --jinja
    ttl: 900
    aliases: [vision]

  retrieval/embedding:
    name: "Qwen 3 Embedding 4B"
    description: "Multilingual/code embeddings; Q8_0; 2560 dimensions"
    capabilities: { in: [text], out: [text], context: 32768 }
    cmd: >-
      admit-run ${env.LIGHT_HOST_RESERVE_GB} ${env.LIGHT_MAX_CURRENT_GTT_GB} --
      llama-server --host 127.0.0.1 --port ${PORT}
      --model /models/retrieval/Qwen3-Embedding-4B-Q8_0.gguf
      --embedding --pooling last --ctx-size 32768 --ubatch-size 8192
      --n-gpu-layers 999
    ttl: 1800
    aliases: [embedding]

  retrieval/reranker:
    name: "Qwen 3 Reranker 4B"
    description: "Multilingual/code reranker; Q4_K_M"
    capabilities: { in: [text], out: [text], reranker: true, context: 32768 }
    cmd: >-
      admit-run ${env.LIGHT_HOST_RESERVE_GB} ${env.LIGHT_MAX_CURRENT_GTT_GB} --
      llama-server --host 127.0.0.1 --port ${PORT}
      --model /models/retrieval/Qwen3-Reranker-4B-Q4_K_M.gguf
      --reranking --embedding --pooling rank --ctx-size 32768
      --n-gpu-layers 999
    ttl: 1800
    aliases: [reranker]

  speech/whisper-large-v3-turbo:
    name: "Whisper Large V3 Turbo"
    description: "Multilingual speech recognition through whisper.cpp"
    capabilities: { in: [audio], out: [text] }
    proxy: "http://127.0.0.1:${PORT}"
    cmd: >-
      admit-run ${env.LIGHT_HOST_RESERVE_GB} ${env.LIGHT_MAX_CURRENT_GTT_GB} --
      whisper-server --host 127.0.0.1 --port ${PORT}
      --model /models/speech/whisper/ggml-large-v3-turbo-q5_0.bin
      --inference-path /v1/audio/transcriptions
    ttl: 1800
    aliases: [whisper]

  speech/kokoro:
    name: "Kokoro 82M TTS"
    description: "Small multilingual text-to-speech model through audio.cpp"
    capabilities: { in: [text], out: [audio] }
    proxy: "http://127.0.0.1:${PORT}"
    cmd: >-
      admit-run ${env.LIGHT_HOST_RESERVE_GB} ${env.TTS_MAX_CURRENT_GTT_GB} --
      audiocpp_server server
      --config /etc/llama-swap/audiocpp.json
      --host 127.0.0.1 --port ${PORT} --backend cpu
    ttl: 1800
    aliases: [tts]

routing:
  router:
    use: group
    settings:
      groups:
        heavyweight-exclusive:
          swap: true
          exclusive: true
          members:
            - llm/fast
            - llm/reasoning
            - llm/coder
            - llm/vision
        retrieval-exclusive:
          swap: true
          exclusive: false
          members:
            - retrieval/embedding
            - retrieval/reranker
        speech-light:
          swap: true
          exclusive: false
          members:
            - speech/whisper-large-v3-turbo
            - speech/kokoro
  scheduler:
    use: fifo
